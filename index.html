<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1c30" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SEAQT · Briefing Operacional</title>
    <!-- Diagnóstico para navegadores sem console (TV): se o app não montar, mostra o erro na tela. ES5 de propósito. -->
    <script>
      (function () {
        var erros = [];
        window.addEventListener('error', function (e) {
          erros.push((e.message || 'erro ao carregar ' + (e.target && e.target.src)) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { erros.push('promise: ' + (e.reason && e.reason.message || e.reason)); });
        // Confere a cada 3 s: o app montou e depois sumiu (ex.: erro após o login), ou nunca montou em 10 s.
        var inicio = Date.now();
        var montou = false;
        var verificador = setInterval(function () {
          var raiz = document.getElementById('root');
          if (!raiz) return;
          if (raiz.children.length) { montou = true; return; }
          if (!montou && Date.now() - inicio < 10000) return;
          clearInterval(verificador);
          var caixa = document.createElement('pre');
          caixa.style.cssText = 'white-space:pre-wrap;font:16px monospace;padding:24px;color:#000;background:#fff';
          caixa.textContent = 'O SEAQT não abriu neste navegador.\n\n' + navigator.userAgent + '\n\n' + (erros.join('\n') || 'nenhum erro registrado');
          document.body.appendChild(caixa);
        }, 3000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
